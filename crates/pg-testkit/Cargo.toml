[package]
name = "pg-testkit"
version = "0.1.0"
edition = "2024"

[lib]
name = "pg_testkit"

# A container-backed test harness. Its own crate, and not a feature of `scheduler-metadata`, so that
# turning it on for one workspace member cannot pull a docker client into another's build: Cargo
# unifies features across members built together, and `metadata-service` ships as an image.
[dependencies]
scheduler-metadata = { path = "../scheduler-metadata" }
anyhow = "1.0.98"
dtor = "1.0.5"
sqlx = { workspace = true }
testcontainers = { version = "0.27.2", features = ["watchdog"] }
testcontainers-modules = { version = "0.15", features = ["postgres"] }
tokio = { version = "1.45.0", features = ["rt", "net", "time"] }
